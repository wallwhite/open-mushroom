name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Opens or refreshes the "Version Packages" pull request; publishing happens in the job below.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  publish:
    name: Publish to npm
    needs: version
    # Runs only once the "Version Packages" pull request has been merged (no pending changesets) and after the
    # first manual release has been made and the npm trusted publisher configured: set the repository variable
    # NPM_PUBLISH_ENABLED to "true" at that point. No npm tokens are involved; npm verifies the OIDC identity.
    if: needs.version.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; the Node runtime ships an older one.
      - run: npm install -g npm@11.19.1
      - run: pnpm install --frozen-lockfile --filter open-mushroom... --filter open-mushroom-monorepo
      - run: pnpm release:publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      # Only the release tags; pushing the branch could race with commits merged meanwhile.
      - run: git push origin --tags
