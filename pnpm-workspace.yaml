packages:
  - packages/*
  - apps/*

catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  gsap: 3.15.0
  typescript: 5.9.3
  vitest: 5.0.0

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Cooldown (minutes) against freshly published, possibly compromised releases.
minimumReleaseAge: 4320

# eslint-plugin-unicorn 73 declares eslint >=10.4 but runs on ESLint 9 (verified by the config tests);
# ESLint 10 is a deliberate future upgrade, so the peer mismatch is expected.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-unicorn>eslint': '9'

# paper.js finds jsdom through a bare require. Without a declared dependency the hoisted copy wins (the
# jsdom the React tests use), whose window cannot be removed, and paper's headless canvas fallback throws.
# paper-jsdom pins jsdom 16 for exactly this; the extension hands the same version to paper itself.
packageExtensions:
  paper:
    dependencies:
      jsdom: ^16.7.0
